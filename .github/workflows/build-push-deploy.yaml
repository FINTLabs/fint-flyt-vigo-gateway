name: Build, Push and Deploy

on:
  push:
    paths-ignore:
      - 'bruno/**'
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: read

jobs:

  build-push:
    uses: fintlabs/shared-workflows/.github/workflows/java-gradle-build-push.yaml@v0
    with:
      java-version: '25'

  beta:
    needs: build-push
    uses: fintlabs/shared-workflows/.github/workflows/kustomize-deploy.yaml@v0
    strategy:
      matrix:
        org:
          - ofk-no
          - tromsfylke-no
          - bfk-no
          - afk-no
          - vlfk-no
          - rogfk-no
          - innlandetfylke-no
          - agderfk-no
          - vestfoldfylke-no
          - trondelagfylke-no
          - telemarkfylke-no
          - ffk-no
    with:
      tags: ${{ needs.build-push.outputs.tags }}
      environment: beta
      org: ${{ matrix.org }}
      deploy-every-branch: true
    secrets: inherit

